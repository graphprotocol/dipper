[workspace]
resolver = "2"
members = [
    "bin/dipper-cli",
    "bin/dipper-service",
    "dipper-core",
    "dipper-iisa",
    "dipper-pgmq",
    "dipper-pgregistry",
    "dipper-producer",
    "dipper-rpc",
]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5.4", features = ["derive"] }
fake = "4.0.0"
jsonrpsee = "0.26.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.11.0"
reqwest = "0.12"
sqlx = { version = "0.8.2", features = ["postgres", "time", "uuid"] }
graph-networks-registry = "0.7"
thegraph-core = "0.15"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.40", default-features = false }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.11.0", features = ["v7"] }
wiremock = "0.6"

[workspace.lints.rust]
# Allow the gen_event_proto cfg flag used for conditional protobuf code generation in dipper-producer
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gen_event_proto)'] }

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cognitive_complexity = "warn"
expect_used = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
unwrap_used = "warn"
