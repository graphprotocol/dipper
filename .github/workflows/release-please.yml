# Manages automated releases via release-please. On main branch pushes, first syncs
# the release manifest with git tags (via sync-manifest action), then creates/updates
# a Release PR with CHANGELOG and version bumps. Merging the Release PR pushes to main,
# which builds the `sha-` and `latest` images, and tags the release, after which this
# workflow starts build.yml on the tag to publish the images under the version as well.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # To start build.yml on a new release's tag.
  actions: write

jobs:
  # First, sync manifest with actual tags to prevent drift
  sync-manifest:
    runs-on: ubuntu-latest
    # Skip if commit was from github-actions bot to prevent circular triggers
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync manifest with tags
        uses: ./.github/actions/sync-manifest

  release-please:
    runs-on: ubuntu-latest
    needs: sync-manifest
    # Run even if sync-manifest was skipped (bot commits)
    if: always() && (needs.sync-manifest.result == 'success' || needs.sync-manifest.result == 'skipped')
    steps:
      - name: Check for open sync PRs
        id: check-sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SYNC_PR=$(gh pr list --repo ${{ github.repository }} --search "sync release-please manifest in:title" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$SYNC_PR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping release-please - manifest sync PR #$SYNC_PR is open. Merge it first."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/release-please-action@v4
        id: release
        if: steps.check-sync.outputs.skip != 'true'

      # A tag pushed with the workflow token starts no workflow, so a release's tag never ran
      # build.yml and no image carried the version that k8s/deployment.yaml names. Starting a
      # workflow by hand is the exception GitHub allows, and on the tag it adds that image tag.
      - name: Build the release's images
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run build.yml --repo "${{ github.repository }}" --ref "$TAG"
