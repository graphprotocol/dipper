# Known vulnerabilities the dependency scan in CI lets through, each with the reason. Remove an
# entry once the crate is updated past it or leaves Cargo.lock.
#
# An entry lets its advisory through for every crate version the advisory covers, not only the
# version named in the reason. So when a crate named here changes version in Cargo.lock, read its
# entry again: the reason may no longer hold for the new version.

# In Cargo.lock but never built: `cargo tree --invert <crate> --target all --edges all
# --all-features` finds no path to them from any dipper crate.

[[IgnoredVulns]]
id = "GHSA-8ffr-xgwf-xj56"
reason = "aws-smithy-json is only reachable through alloy's AWS signer, which dipper does not build."

[[IgnoredVulns]]
id = "GHSA-h395-gr6q-cpjc"
reason = "jsonwebtoken is only reachable through alloy's Google Cloud signer, which dipper does not build."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys is only reachable through sqlx's SQLite driver. Dipper uses Postgres and does not build it."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa is only reachable through sqlx's MySQL driver. Dipper uses Postgres and does not build it."

# Built, with no fixed release dipper can take until the libraries that pull them in move on.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "Timing leaks in crypto-bigint, fixed only in 0.7.6. Dipper builds 0.5.5 under k256, the secp256k1 library alloy signs with, which uses it to add, subtract, negate and range-check secret values while signing and does its own multiplication and inversion. The fixes were made to 0.7 code; nobody has shown whether 0.5.5 leaks in the operations k256 uses, and no constant-time check has been run on it. Goes when alloy moves to k256 0.14."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0258"
reason = "h2 0.3 comes in under reqwest 0.11, which the networks registry client uses to fetch the registry at startup, and under the IPFS client in indexer-rs, which dipper never calls. That reqwest is built without the feature that negotiates HTTP/2 over TLS, so the registry fetch uses HTTP/1.1 and does not reach h2. No 0.3 release is fixed. Dipper's other HTTP/2 traffic uses h2 0.4, which is updated past the fix."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
reason = "lru 0.16 backs alloy's provider caches. Only a key whose drop code panics can trigger it, and those keys are block numbers and hashes. Only 0.18 is fixed, which needs a new alloy release."

