apiVersion: apps/v1
kind: Deployment
metadata:
  name: dipper
  labels:
    app: dipper
spec:
  # A rollout stops the old pod before starting the new one. With the default RollingUpdate
  # both would run for a while: each keeps its own nonce for the one signer and its own
  # in-process locks (the global reassess lock among them) while both pull jobs from the same
  # queue, so they could send transactions on the same nonce and offer or cancel the same
  # agreement twice. The price is a gap while the new pod starts. This covers rollouts only:
  # when a pod is evicted, deleted or its node drained, Kubernetes starts the replacement while
  # the old pod is still terminating, which only a lock in dipper itself can rule out.
  # `rollingUpdate: null` drops the defaulted settings a client-side apply would otherwise keep,
  # which the API refuses next to `Recreate`.
  strategy:
    type: Recreate
    rollingUpdate: null
  replicas: 1
  selector:
    matchLabels:
      app: dipper
  template:
    metadata:
      labels:
        app: dipper
    spec:
      # Above the service's own teardown budget: once shutdown starts it has 75s in
      # total to stop its 11 services, flush events and close the DB pool, after which
      # it exits by itself. A SIGKILL part-way through the teardown stays out of reach.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dipper
          image: ghcr.io/graphprotocol/dipper-service:v0.3.4 # x-release-please-version
          args:
            - /config/config.json
          # Dipper logs at info unless RUST_LOG is set, for example to `dipper_service=debug,info`.
          # Left unset here, as an env entry would override a level an environment supplies.
          ports:
            - name: admin-rpc
              containerPort: 8545
              protocol: TCP
            - name: health
              containerPort: 8546
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Startup can take minutes, and every step runs before the health port
          # opens: the RPC domain fetch (6 tries, 62s of pauses between them), the
          # wait for the database (db.connect_wait, 120s), migrations, the indexer
          # URL snapshot (6 tries of up to 30s, 62s of pauses) and the wait for
          # IISA (iisa.startup_wait, 180s). Those add up to around 10 minutes when
          # every dependency is slow, so liveness stays suspended for up to 15
          # minutes (900s); raise it with the waits.
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          # Probe the health endpoint, not a TCP socket: it returns 503 once the
          # worker watermark goes stale, catching a worker that is alive but
          # stuck. 6 failures so a brief stall cannot kill the only replica.
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: admin-rpc
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dipper-config
